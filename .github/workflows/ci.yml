name: ci

# The gates a change has to pass, and the two things that come out of a tag:
#
#   lint    compile --warnings-as-errors, formatting, credo --strict. Fails
#           fastest, so it is the job that tells you first.
#   test    the suite. The Rust engine is compiled here, which is why every job
#           that touches Elixir installs a toolchain first: `rustler` builds the
#           crate when the dependency compiles, so a runner without cargo cannot
#           even run `mix deps.get`.
#   types   dialyzer, against a PLT the cache carries between runs.
#
# `release`, in its own workflow, publishes the package to Hex and attaches the
# source to a GitHub release, from a `v*.*.*` tag and only on a tag — see
# `release.yml`.
#
# What does *not* run: a commit that only touched prose. Nothing it changes is
# compiled or tested.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", "NOTICE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.5"
  OTP_VERSION: "29.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/brep_nif
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix credo --strict

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/brep_nif
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-test-${{ runner.os }}-
      - run: mix deps.get
      # A machine with no cargo is a machine where the engine does not exist;
      # the suite proves it was built rather than skipping over it.
      - run: mix test

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/brep_nif
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: deps-types-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-types-${{ runner.os }}-
      - run: mix deps.get
      - run: mkdir -p priv/plts
      - run: mix dialyzer
